[package]
name = "bidking-rs"
version = "0.2.0"
edition = "2024"
autobins = false

[features]
default = []
dev-cli = ["clap"]

[lib]
name = "bidking_rs"
path = "src/lib.rs"

[[bin]]
name = "bidking-analyzer"
path = "src/bin/bidking-gui.rs"

[[bin]]
name = "bidking-dev"
path = "src/main.rs"
required-features = ["dev-cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
csv = "1"
eframe = "0.31"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
paddle-ocr-rs = { version = "0.6.1", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
